<!-- Header Initialization Script -->
<script>
    (function initializeHeader() {
        const themeToggle = document.getElementById('themeToggle');
        const menuToggle = document.getElementById('menuToggle');
        const mainNav = document.getElementById('mainNav');
        const body = document.body;

        // Theme Toggle
        if (themeToggle) {
            themeToggle.addEventListener('click', () => {
                body.classList.toggle('light-mode');
                themeToggle.setAttribute('aria-label', body.classList.contains('light-mode') ? 'Switch to dark mode' : 'Switch to light mode');
            });
        }

        // Mobile Menu Toggle
        if (menuToggle) {
            menuToggle.addEventListener('click', () => {
                const isOpen = menuToggle.getAttribute('aria-expanded') === 'true';
                menuToggle.setAttribute('aria-expanded', String(!isOpen));
                menuToggle.setAttribute('aria-label', isOpen ? 'Open navigation menu' : 'Close navigation menu');
                mainNav.classList.toggle('hidden', isOpen);
                mainNav.classList.toggle('flex', !isOpen);
                const icon = menuToggle.querySelector('[data-lucide]');
                if (icon) {
                    icon.setAttribute('data-lucide', isOpen ? 'menu' : 'x');
                    lucide?.createIcons?.();
                }
            });
        }

        // Close mobile menu on link click
        if (mainNav) {
            mainNav.querySelectorAll('a').forEach(link => link.addEventListener('click', () => {
                mainNav.classList.add('hidden');
                mainNav.classList.remove('flex');
                if (menuToggle) {
                    menuToggle.setAttribute('aria-expanded', 'false');
                    menuToggle.setAttribute('aria-label', 'Open navigation menu');
                }
            }));
        }
    })();
</script>
